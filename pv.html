<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050003">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>INSIDE IDENTITY PV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Maru+Gothic:wght@900&family=Noto+Sans+TC:wght@500;700;900&family=JetBrains+Mono:wght@500;700&display=block" rel="stylesheet">
<style>
  :root { color-scheme: dark; --accent: #ff2a4a; --line: rgba(255, 42, 74, 0.35); }
  html, body { margin: 0; height: 100%; background: #050003; color: #f3e9ee; overflow: hidden; font: 14px/1.45 "Noto Sans TC", system-ui, sans-serif; overscroll-behavior: none; }
  body { display: grid; place-items: center; height: 100dvh; }
  #pv { width: min(100vw, calc(100dvh * 16 / 9)); aspect-ratio: 16 / 9; display: block; background: #000; touch-action: manipulation; }
  #ui { position: fixed; left: 50%; bottom: max(16px, env(safe-area-inset-bottom)); translate: -50% 0; display: flex; gap: 8px; align-items: center; padding: 10px 14px;
    border-radius: 14px; background: rgba(14, 6, 12, 0.82); border: 1px solid var(--line); backdrop-filter: blur(8px);
    width: min(960px, calc(100vw - 32px)); box-sizing: border-box; transition: opacity .4s; touch-action: manipulation; }
  #ui.idle { opacity: 0; pointer-events: none; }
  #ui button { font: inherit; color: #fff; background: rgba(255, 42, 74, 0.14); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; cursor: pointer; white-space: nowrap; touch-action: manipulation; }
  #ui button:hover { background: rgba(255, 42, 74, 0.3); }
  #play { background: var(--accent) !important; font-weight: 700; }
  #nowTitle { max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 700; }
  #seek { flex: 1; min-width: 60px; accent-color: var(--accent); touch-action: manipulation; }
  #time { font: 12px ui-monospace, Menlo, monospace; white-space: nowrap; color: #a88f9b; }
  #menu { position: fixed; inset: 0; display: block; background: rgba(5, 0, 3, 0.94); z-index: 4; overflow: auto; padding: max(24px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom)); box-sizing: border-box; -webkit-overflow-scrolling: touch; }
  body:has(#menu:not([hidden])) #ui { visibility: hidden; }
  #menu[hidden] { display: none; }
  #menu .inner { width: min(1080px, 100%); margin: 0 auto; }
  .touch { display: none; }
  #menu h1 { margin: 0; font: 400 clamp(28px, 4vw, 44px)/1.1 "Dela Gothic One", sans-serif; letter-spacing: .04em; text-shadow: 2px 0 #ff2a4a, -2px 0 #3fd7ff; }
  #menu p { color: #a88f9b; margin: 8px 0 18px; }
  #menu a { color: #ffb0bd; }
  #list { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
  #list button { text-align: left; font: inherit; color: #fff; border: 1px solid rgba(255, 255, 255, 0.14); border-radius: 14px; padding: 16px 18px; cursor: pointer;
    background: radial-gradient(120% 140% at 30% 20%, var(--c), var(--e)); transition: transform .15s, border-color .15s; touch-action: manipulation; }
  #list button:hover { transform: translateY(-2px); border-color: var(--a); }
  #list small { display: block; font: 11px ui-monospace, Menlo, monospace; letter-spacing: .15em; opacity: .8; }
  #list strong { display: block; margin: 6px 0 4px; font-size: 18px; font-weight: 900; }
  #list span { display: block; color: var(--a); font-weight: 700; }
  #list em { display: block; font-style: normal; font-size: 12px; opacity: .75; margin-top: 8px; }
  #ytBox { position: fixed; right: max(16px, env(safe-area-inset-right)); bottom: calc(var(--ui-h, 72px) + 12px); width: min(320px, 40vw); aspect-ratio: 16 / 9; border-radius: 10px; overflow: hidden;
    border: 1px solid var(--line); background: #000; box-shadow: 0 6px 24px rgba(0, 0, 0, .5); z-index: 3; }
  #ytBox iframe { width: 100%; height: 100%; display: block; border: 0; }
  #msg { position: fixed; top: 16px; left: 50%; translate: -50% 0; background: rgba(0, 0, 0, .6); padding: 6px 12px; border-radius: 8px; z-index: 3; }
  #msg:empty { display: none; }
  body.render #ui, body.render #menu, body.render #msg, body.render #ytBox { display: none !important; }
  @media (pointer: coarse) {
    .keys { display: none; }
    .touch { display: inline; }
    #list button { min-height: 72px; }
    #ui button { min-height: 44px; min-width: 44px; padding: 8px 12px; }
  }
  @media (max-width: 820px), (max-height: 500px) {
    body { display: flex; flex-direction: column; justify-content: center; padding-bottom: calc(var(--ui-h, 76px) + env(safe-area-inset-bottom)); box-sizing: border-box; }
    #pv { width: min(100vw, calc((100dvh - var(--ui-h, 76px) - env(safe-area-inset-bottom)) * 16 / 9)); max-height: calc(100dvh - var(--ui-h, 76px) - env(safe-area-inset-bottom)); }
    #ui { left: 0; right: 0; bottom: 0; translate: none; width: 100%; border-radius: 16px 16px 0 0; border-left: 0; border-right: 0; border-bottom: 0;
      flex-wrap: wrap; gap: 8px; padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); }
    #seek { order: 9; flex-basis: 100%; height: 32px; }
    #nowTitle { flex: 1; max-width: none; }
    #list { grid-template-columns: 1fr; }
    #menu h1 { font-size: clamp(26px, 8vw, 40px); }
    #ytBox { left: auto; right: max(8px, env(safe-area-inset-right)); width: min(200px, 56vw); opacity: 0; pointer-events: none; }
    #ytBox.show { opacity: 1; pointer-events: auto; }
    #ytPeek:not([hidden]) { display: inline-block; }
  }
</style>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js" } }
</script>
</head>
<body>
<canvas id="pv" width="1920" height="1080"></canvas>
<div id="ui">
  <button id="toMenu">☰ 選歌</button>
  <button id="prev" aria-label="上一首">⏮</button>
  <button id="play">▶ 播放</button>
  <button id="next" aria-label="下一首">⏭</button>
  <button id="full" aria-label="全螢幕">⛶</button>
  <button id="ytPeek" hidden>原片</button>
  <span id="nowTitle"></span>
  <input id="seek" type="range" min="0" max="1000" value="0" aria-label="播放位置">
  <span id="time">0:00 / 0:00</span>
</div>
<div id="menu" hidden>
  <div class="inner">
    <h1>INSIDE IDENTITY · PV</h1>
    <p>八位班底重新繪製成 INSIDE IDENTITY 制服風，預設搭配原曲 <a href="https://www.youtube.com/watch?v=hNQdpqp_VdY" target="_blank" rel="noopener">INSIDE IDENTITY（YouTube）</a>，另為 9 首歌各做一支 PV。<span class="keys">選一首即時播放（Space 播放／暫停、← → ±5 秒、N／P 換歌、F 全螢幕、Esc 回選單）。</span><span class="touch">點一首開始播放，點畫面暫停。</span> <a href="index.html">← 3D 舞台</a></p>
    <div id="list"></div>
  </div>
</div>
<div id="ytBox" hidden><div id="ytPlayer"></div></div>
<div id="msg"></div>
<script type="module" src="js/pv/pv.js"></script>
</body>
</html>
